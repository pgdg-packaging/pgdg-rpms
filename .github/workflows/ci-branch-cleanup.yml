# Delete stale ci/<name> branches from the GitHub mirror.
#
# Deleting a branch on git.postgresql.org does not delete it here, so remove
# every ci/ branch whose last commit is older than MAX_AGE_DAYS.
#
# Per https://github.com/pgdg-packaging/pgdg-rpms/issues/442

name: ci branch cleanup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  MAX_AGE_DAYS: 7

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale ci/ branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d "$MAX_AGE_DAYS days ago" +%s)
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/ci/" \
            --jq '.[] | "\(.ref) \(.object.sha)"' |
          while read -r ref sha; do
            date=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq .commit.committer.date)
            if [ "$(date -u -d "$date" +%s)" -lt "$cutoff" ]; then
              echo "Deleting ${ref#refs/heads/} (last commit $date)"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/${ref#refs/}"
            else
              echo "Keeping ${ref#refs/heads/} (last commit $date)"
            fi
          done
