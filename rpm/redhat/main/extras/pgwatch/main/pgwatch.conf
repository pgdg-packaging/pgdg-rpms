# Environment file for the pgwatch systemd service. pgwatch reads its
# settings from PW_* environment variables; run "pgwatch --help" to see
# all of them. Extra command line options can be passed via PGWATCH_OPTS.

# Postgres URI, YAML file or folder of YAML files listing the monitored
# databases:
PW_SOURCES=/etc/pgwatch/sources.yaml

# Where to store the metrics. Examples:
#   prometheus://127.0.0.1:9187
#   postgresql://pgwatch:secret@localhost:5432/pgwatch_metrics
#   jsonfile:///var/lib/pgwatch/metrics.json
PW_SINK=prometheus://127.0.0.1:9187

# Metric definitions. The built-in definitions are used when not set.
#PW_METRICS=/usr/share/pgwatch/metrics.yaml

# REST API and web UI. Set PW_WEBDISABLE=all to disable both.
PW_WEBADDR=127.0.0.1:8080
#PW_WEBUSER=admin
#PW_WEBPASSWORD=
#PW_WEBDISABLE=ui

PW_EMERGENCY_PAUSE_TRIGGERFILE=/var/lib/pgwatch/emergency-pause

PGWATCH_OPTS=
